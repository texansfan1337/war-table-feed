<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Neverwinter City Map</title>
<style>
/* Layout: zoomable map on the left, gazetteer panel on the right; stacks map-over-panel on phones.
   City zoom shows district chips; district zoom reveals shop and landmark pins. */
:root{
  --bg:#e9dfc6; --panel:#f5eedb; --panel2:#efe5cb; --line:#cfc09c; --ink:#2a2017; --dim:#6b5a40;
  --crimson:#7d1f1f; --navy:#22314f; --purple:#5a3a72; --gold:#a8831c; --ok:#3f7a52;
  --read-bg:#fbf5e4; --dm-bg:#f6e3df; --pin-shop:#22314f; --pin-land:#a8831c; --pin-site:#7d1f1f;
  --pin-ink:#fbf5e4; --chip-bg:rgba(42,32,23,.88); --chip-ink:#f5eedb; --vp:#1b1712;
  --display:Georgia,"Times New Roman",serif; --body:Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15120e; --panel:#1d1915; --panel2:#25201a; --line:#3b3229; --ink:#ebe2cf; --dim:#a6977d;
  --crimson:#d06a5e; --navy:#93acd6; --purple:#b597d0; --gold:#d4ad45; --ok:#6fb586;
  --read-bg:#221d17; --dm-bg:#2c1c1a; --pin-shop:#3d5788; --pin-land:#b8912a; --pin-site:#a83232;
  --pin-ink:#fbf5e4; --chip-bg:rgba(18,15,11,.9); --chip-ink:#f0e6d0; --vp:#0e0c09; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#15120e; --panel:#1d1915; --panel2:#25201a; --line:#3b3229; --ink:#ebe2cf; --dim:#a6977d;
  --crimson:#d06a5e; --navy:#93acd6; --purple:#b597d0; --gold:#d4ad45; --ok:#6fb586;
  --read-bg:#221d17; --dm-bg:#2c1c1a; --pin-shop:#3d5788; --pin-land:#b8912a; --pin-site:#a83232;
  --pin-ink:#fbf5e4; --chip-bg:rgba(18,15,11,.9); --chip-ink:#f0e6d0; --vp:#0e0c09; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;overflow:hidden}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{display:flex;height:100%;width:100%}
.vp{flex:1;min-width:0;position:relative;overflow:hidden;background:var(--vp);touch-action:none;cursor:grab}
.vp.drag{cursor:grabbing}
.stage{position:absolute;left:0;top:0;transform-origin:0 0}
.overlay{position:absolute;inset:0;pointer-events:none;z-index:3}
.overlay>*{pointer-events:auto}
.stage img{display:block;width:1532px;height:1080px;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.layer{position:absolute;inset:0}
.chip{position:absolute;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.35);
  background:var(--chip-bg);color:#fff;padding:6px 12px 6px 8px;border-radius:999px;font-size:14px;font-weight:bold;white-space:nowrap;
  cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 2px 10px rgba(0,0,0,.45);transition:opacity .2s}
.chip b{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--pin-site);color:#fff;font-size:12px;letter-spacing:.02em}
.chip:hover{border-color:var(--gold)}
.chip.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 2px 10px rgba(0,0,0,.45)}
.dlabel{position:absolute;transform:translate(-50%,-50%);pointer-events:none!important;color:#fff;font-size:14px;font-weight:bold;letter-spacing:.14em;text-transform:uppercase;
  text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,0 0 6px rgba(0,0,0,.9);white-space:nowrap}
.pin{position:absolute;transform:translate(-50%,-50%);width:38px;height:38px;border:0;background:none;padding:0;cursor:pointer;
  filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.8)) drop-shadow(0 0 3px rgba(0,0,0,.45))}
.sym{position:relative;display:inline-block;flex:none}
.sym svg{display:block;width:100%;height:100%;overflow:visible}
.sym .num{position:absolute;transform:translate(-50%,-50%);font:bold 11px/1 Georgia,serif;font-variant-numeric:tabular-nums;pointer-events:none}
.pin .sym{width:38px;height:38px}
.pin .sym .num{font-size:12.5px}
.pin.on{filter:drop-shadow(0 0 0 #000) drop-shadow(0 0 4px var(--gold)) drop-shadow(0 0 2px var(--gold))}
.vp:not(.dm) .dmleg{display:none!important}
.pin .tip{position:absolute;top:40px;left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(0,0,0,.88);color:#f5ead0;font-weight:normal;
  font-size:12px;padding:3px 8px;border-radius:4px;opacity:0;pointer-events:none;transition:opacity .12s}
.pin:hover .tip,.pin:focus-visible .tip,.pin.on .tip{opacity:1}
.pin.done::after{content:"";position:absolute;right:-2px;top:-2px;width:10px;height:10px;border-radius:50%;background:var(--ok);border:1px solid #fff}
.mode-city .pin,.mode-city .dlabel{display:none}
.mode-detail .chip{opacity:0;pointer-events:none}
.ctrls{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;z-index:5}
.ctrls button{width:38px;height:38px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:var(--chip-bg);color:var(--chip-ink);font-size:18px;cursor:pointer}
.ctrls button.txt{font-size:11px;letter-spacing:.06em}
.legend{position:absolute;left:12px;bottom:12px;z-index:5;background:var(--chip-bg);color:var(--chip-ink);font-size:12.5px;border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:auto auto;gap:6px 16px;max-width:calc(100% - 80px)}
.legend .lh{grid-column:1/-1;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#d9c48a;display:flex;justify-content:space-between;align-items:center;gap:12px}
.legend .lh button{background:none;border:0;color:#d9c48a;cursor:pointer;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:0}
.legend .le{display:flex;align-items:center;gap:8px;white-space:nowrap}
.legend .le .sym{width:20px;height:20px}
.legend.min{grid-template-columns:auto}
.legend.min .le{display:none}
.zoomhint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--chip-bg);color:var(--chip-ink);font-size:12.5px;padding:5px 12px;border-radius:999px;z-index:5;pointer-events:none}
.panel{width:min(440px,40%);min-width:0;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column}
.phead{padding:14px 18px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;background:var(--panel2)}
.crumb{font-size:12.5px;color:var(--dim);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumb a{color:var(--navy);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.prow{display:flex;gap:8px;align-items:center}
.prow input{flex:1;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font-family:inherit;font-size:14px}
.dmbtn{padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer;font-size:12.5px;letter-spacing:.04em;white-space:nowrap}
.dmbtn.on{background:var(--crimson);color:#fff;border-color:var(--crimson)}
.tags{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.tag{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.tag small{color:var(--dim);margin-left:4px;font-variant-numeric:tabular-nums}
.tag.on{background:var(--navy);border-color:var(--navy);color:var(--panel)}
.tag.on small{color:var(--panel);opacity:.8}
.tag.clear{border-style:dashed;color:var(--crimson)}
.pills{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 12px}
.pill{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--dim);background:var(--panel2);cursor:pointer}
.pill:hover{border-color:var(--navy);color:var(--navy)}
.vp.filtering .pin.nomatch{opacity:.2}
.pin{z-index:2}
.chip{z-index:1}
.vp.filtering .chip{opacity:.45}
.vp.filtering.mode-city .chip{font-size:12px}
.tagrow{display:flex;gap:6px;align-items:center;min-width:0}
.tagrow .tags{flex:1;min-width:0}
.tclear{flex:none;border:1px dashed var(--crimson);color:var(--crimson);background:var(--panel);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer}
.vp.filtering.mode-city .pin.match{display:block}
.pbody{flex:1;overflow-y:auto;padding:16px 18px 40px}
h1{font-family:var(--display);color:var(--crimson);font-size:26px;line-height:1.2;margin:0 0 2px;text-wrap:balance}
h2{font-family:var(--display);color:var(--navy);font-size:21px;line-height:1.25;margin:0 0 2px;text-wrap:balance}
h3{font-family:var(--display);color:var(--purple);font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin:20px 0 8px}
.sub{color:var(--dim);font-size:13px;margin:0 0 12px}
.quote{font-style:italic;color:var(--dim);margin:0 0 14px;max-width:62ch}
.read{background:var(--read-bg);border-left:3px solid var(--gold);padding:10px 12px;border-radius:0 6px 6px 0;margin:0 0 10px;max-width:65ch}
.read .lbl,.card .lbl{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.card{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 10px;background:var(--panel)}
.card.sig{border-color:var(--gold)}
.dmn{background:var(--dm-bg);border:1px dashed var(--crimson);border-radius:6px;padding:9px 11px;margin:0 0 8px;font-size:14px}
.dmn b{color:var(--crimson)}
.list{display:flex;flex-direction:column;gap:4px}
.item{display:flex;gap:10px;align-items:baseline;padding:7px 8px;border-radius:6px;cursor:pointer;border:1px solid transparent;text-align:left;background:none;width:100%;font-size:14.5px}
.item:hover{background:var(--panel2);border-color:var(--line)}
.item .isym{width:24px;height:24px;margin-top:-2px}
.item .isym .num{font-size:9px}
.item .code{flex:none;font-size:11.5px;font-weight:bold;color:var(--pin-ink);background:var(--pin-shop);border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums}
.item .code.landmark{background:var(--pin-land);color:#1d150c;border-radius:4px}
.item .code.site{background:var(--pin-site);color:#fff}
.item .code.hearth{background:#c4621d;color:#fff}
.detail{margin:0 0 12px;max-width:65ch}
.item .meta{color:var(--dim);font-size:12.5px;display:block}
.kv{display:grid;grid-template-columns:88px 1fr;gap:4px 12px;margin:0 0 12px;font-size:14.5px}
.kv dt{color:var(--dim);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding-top:2px}
.kv dd{margin:0;min-width:0}
.clue{border:1px solid var(--line);border-radius:8px;margin:0 0 8px;background:var(--panel)}
.clue.big{border:2px solid var(--gold)}
.clue.dmonly{border-style:dashed;border-color:var(--crimson)}
.chd{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;cursor:pointer}
.cn{flex:none;font-size:11.5px;font-weight:bold;color:var(--dim);font-variant-numeric:tabular-nums;padding-top:2px;min-width:22px}
.ct{flex:1;min-width:0}
.ct small{display:block;color:var(--dim);font-size:12.5px}
.tick{flex:none;width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;color:transparent;font-size:15px}
.tick.on{background:var(--ok);border-color:var(--ok);color:#fff}
.cbd{display:none;padding:0 12px 11px 42px;font-size:14.5px}
.clue.open .cbd{display:block}
.tell{margin:0 0 6px}
.mean{color:var(--dim)}
.mean b{color:var(--crimson)}
.tb{display:inline-block;margin-left:6px;font-size:10.5px;letter-spacing:.06em;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--dim)}
.trow{display:flex;gap:8px;align-items:flex-start;font-size:14px;padding:4px 0}
.dot{flex:none;width:11px;height:11px;border-radius:50%;border:1px solid var(--dim);margin-top:5px}
.dot.lit{background:var(--ok);border-color:var(--ok)}
.trow.core b{color:var(--gold)}
.back{margin-top:18px;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);cursor:pointer;font-size:14px}
.empty{color:var(--dim);font-style:italic}
.lock{border:1px solid var(--crimson);border-radius:8px;padding:12px;margin:0 0 14px;background:var(--dm-bg);display:flex;flex-direction:column;gap:8px}
.lock label{font-size:13px;color:var(--crimson);letter-spacing:.04em}
.lock .prow input{background:var(--panel)}
.lock .err{color:var(--crimson);font-size:13px;margin:0}
.lock button{padding:7px 12px;border:1px solid var(--crimson);border-radius:6px;background:var(--crimson);color:#fff;cursor:pointer}
@media (max-width:820px){
  .app{flex-direction:column}
  .vp{flex:none;height:52%}
  .panel{width:100%;flex:1;border-left:none;border-top:1px solid var(--line);min-height:0}
  .legend{left:8px;bottom:8px;font-size:11.5px;padding:8px 10px;gap:4px 10px}
}
@media (prefers-reduced-motion: reduce){ .chip,.pin .tip{transition:none} }
</style>

const DATA = {"city": {"title": "Neverwinter", "sub": "Capital of the North · under Crown blockade · 1487 DR", "quote": "", "globals": [["The Hour-Tone", "The Horologe bell on the north-bank green strikes every hour. Every Driftstone lamp in the city lights in the colour of its glass in answer. Most homes still burn oil."], ["The blockade", "The Crown Fleet holds the sea beyond the harbor; no ship has passed it since it arrived. Shipyards are idle, crews are stranded, and foreign coin is scarce, so the city mints Driftstone scrip. Food is adequate."], ["Governor", "Lord Edrion Vaelcrest rules from Castle Never. Neverwinter does not recognize King Darius. The city guard are the Graycloaks."]]}, "districts": [{"id": "castle", "code": "C", "name": "Castle Never", "sub": "North bank · round fortress at the river mouth", "pin": [31.0, 47.6], "bounds": [24, 40, 38, 59], "quote": "", "sigName": "The Cold Flame", "sig": "A Spellglass brazier-stone in the forecourt was struck to open every session of the Council of Eight Flames. It has not been struck since King Alaric removed Neverwinter's seat. Citizens leave tuning forks at its base in protest.", "places": [{"code": "C1", "name": "The Petition Hall", "x": 30.8, "y": 48.4, "spec": "Issues numbered petition tokens and records every grievance brought to the Governor.", "price": "Free", "owner": "Clerk-Warden Amsel Fairlow.", "detail": "All petitions to the Governor start here. Clerks take your name and grievance and issue a numbered brass token; numbers are called in order on petition days. Written petitions can be lodged any day and are read aloud when their number comes up.", "cat": "civic", "tags": ["Civic & law"], "kind": "shop"}, {"code": "C2", "name": "The Cold Flame", "x": 32.4, "y": 45.6, "spec": "Unlit Spellglass brazier in the castle forecourt.", "price": "", "owner": "", "detail": "Formerly struck to open sessions of the Council of Eight Flames. Neverwinter lost its seat when King Alaric labelled House Vaelcrest obstructionists, and the stone has not been struck since. The tuning forks left at its base are an informal protest.", "cat": "landmark", "tags": ["Landmark", "Magistone"], "kind": "landmark"}, {"code": "C3", "name": "The Scriveners' Steps", "x": 29.2, "y": 46.2, "spec": "Scribes on the castle stair who write petitions, contracts and letters for a fee per line.", "price": "$", "owner": "Jory Lisk, scribe.", "cat": "service", "tags": ["Services"], "kind": "shop"}, {"code": "C4", "name": "The Graycloak Muster", "x": 29.4, "y": 50.4, "spec": "City guard recruiting hall: pay, terms and wanted notices.", "price": "—", "owner": "Sergeant Halla Venner.", "detail": "The Graycloaks patrol the walls and harbor, police the markets and answer to Castle Never. Service is three years at steady pay. The board outside lists wanted thieves, forgers and Crown agents.", "cat": "civic", "tags": ["Civic & law", "Work & hiring"], "kind": "shop"}, {"code": "C5", "name": "Brask's Cider Barrow", "x": 28.6, "y": 55.8, "spec": "Hot cider in clay cups for the petition queue on the Dolphin Bridge; a copper back for the cup.", "price": "$", "owner": "Odo Brask, cider seller.", "cat": "tavern", "tags": ["Food"], "kind": "shop"}, {"code": "C6", "name": "The Winged Wyvern Bridge", "x": 35.8, "y": 54.4, "spec": "Carved bridge linking the castle to the Enclave; the only one to survive the Ruining intact.", "price": "", "owner": "", "detail": "One of Neverwinter's three carved bridges. The stone piers of the Sleeping Dragon, the bridge that fell, stand in the water upstream.", "cat": "landmark", "tags": ["Landmark"], "kind": "landmark"}], "overview": "Seat of the Governor: courts, treasury and the city guard, inside round gray walls at the river mouth. Few residents besides staff. The Governor hears public petitions on set days each tenday."}, {"id": "blacklake", "code": "B", "name": "Blacklake", "sub": "North bank · wealthy district around a dark lake", "pin": [37.5, 33.5], "bounds": [22, 18, 48, 42], "quote": "", "sigName": "The Drowned Stars", "sig": "Vows are sealed by striking a Driftstone pebble and throwing it into the lake while it sounds. Several thousand lie on the bottom. After dark, at each Hour-Tone, they glow briefly under the water.", "places": [{"code": "B1", "name": "The Drowned Stars", "x": 41.8, "y": 26.0, "spec": "The lake and the vow-pebbles on its bed.", "price": "", "owner": "", "detail": "Vows are sealed by striking a Driftstone pebble and throwing it in while it sounds; the bed holds several thousand. Swimming is allowed but rare.", "cat": "landmark", "tags": ["Landmark", "Magistone"], "kind": "landmark"}, {"code": "B2", "name": "The Moonstone Mask", "x": 36.5, "y": 33.0, "spec": "Festhall on the lakeshore: music, dining, gaming and private rooms. Masks required after dusk.", "price": "$$$", "owner": "Madam Seraphine Doln, proprietor.", "detail": "Rebuilt after the Ruining. Music most nights, a dining room, card and dice tables upstairs, private rooms by the hour. Masks are provided at the door after dusk.", "cat": "tavern", "tags": ["Tavern", "Food", "Entertainment"], "kind": "shop"}, {"code": "B3", "name": "Pebbles & Promises", "x": 33.0, "y": 37.0, "spec": "Polished Driftstone vow-pebbles, plain or engraved, single or matched pairs.", "price": "$$", "owner": "Ilse Carrow, merchant.", "detail": "Prices: plain pebble 2 gp; engraved 5 gp; matched pair cut from one stone 25 gp; tuning fork 1 gp.", "cat": "shop", "tags": ["Shop", "Magistone"], "kind": "shop"}, {"code": "B4", "name": "Thessaly Clockworks", "x": 28.1, "y": 32.8, "spec": "Luxury water and table clocks, set by the Hour-Tone.", "price": "$$$", "owner": "Master Aurel Thessaly, clockmaker.", "cat": "shop", "tags": ["Shop", "Crafts", "Luxury"], "kind": "shop"}, {"code": "B5", "name": "Saldane & Rook, Jewelers", "x": 30.0, "y": 28.6, "spec": "Fine jewelry, including settings for vow-pebbles worn instead of thrown.", "price": "$$$", "owner": "Corvin Saldane sells; Ammet Rook, half-elf, appraises.", "cat": "shop", "tags": ["Shop", "Luxury"], "kind": "shop"}, {"code": "B6", "name": "The Glass Swan", "x": 41.1, "y": 30.6, "spec": "Tea house on stilts over the lake; frequented by scholars and diplomats.", "price": "$$", "owner": "Wen Ashlo, tea master.", "cat": "tavern", "tags": ["Food", "Luxury"], "kind": "shop"}, {"code": "B7", "name": "Blacklake Boathouse", "x": 35.6, "y": 28.6, "spec": "Rowboat hire by the hour; the Hour-Tone row to the lake's center costs most.", "price": "$$", "owner": "Tobin Reed, boatman.", "cat": "service", "tags": ["Guides & transport"], "kind": "shop"}, {"code": "B8", "name": "Lakeview Bench Office", "x": 44.0, "y": 32.2, "spec": "Rents promenade benches by the hour; proposal bookings fill weeks ahead.", "price": "$", "owner": "Perpetua Wynn, clerk.", "cat": "service", "tags": ["Services"], "kind": "shop"}, {"code": "B9", "name": "The House of Knowledge", "x": 32.4, "y": 29.4, "spec": "Temple of Oghma and public library. Donation to read; permit to copy.", "price": "", "owner": "", "detail": "The city's largest public library is beneath the nave. Readers donate at the door; copying requires a permit from the scribes, who also sell copies of maps, charters and city records. Public lectures on rest days.", "cat": "temple", "tags": ["Temple", "Books & learning"], "kind": "shop"}, {"code": "B10", "name": "Cormyrean Legation (shuttered)", "x": 26.4, "y": 38.4, "spec": "The Crown's embassy on Embassy Row, closed since the city refused to recognize King Darius.", "price": "", "owner": "", "detail": "Staff left overland before the blockade. The Graycloaks watch the building.", "cat": "civic", "tags": ["Civic & law", "Landmark"], "kind": "shop"}], "overview": "Townhouses, walled gardens, consulates and scholars' residences around a dark lake. The lakeshore promenade is the city's most expensive walk. Some houses are shuttered, their owners stranded abroad by the blockade."}, {"id": "river", "code": "R", "name": "River District", "sub": "North bank, east · lampwrights, glassblowers, stranded crews", "pin": [70.0, 31.0], "bounds": [53, 15, 82, 47], "quote": "", "sigName": "The First Answer", "sig": "Every new lamp is hung over Lampwrights' Row for its first Hour-Tone before sale. A clean, bright response earns the maker's name in chalk on the wall. Apprentices bet on the colour.", "places": [{"code": "R1", "name": "The Horologe", "x": 56.0, "y": 40.2, "spec": "Clock hall on the round green; its bell strikes the Hour-Tone.", "price": "", "owner": "", "detail": "Keepers strike the bell every hour in shifts. The Horologe also holds the city's standard clock, used to set every water clock in Neverwinter.", "cat": "landmark", "tags": ["Landmark", "Magistone"], "kind": "landmark"}, {"code": "R2", "name": "Lampwrights' Row", "x": 65.6, "y": 33.4, "spec": "Street of lamp-makers. New lamps hang over the street for their first Hour-Tone; bets are chalked on the walls.", "price": "$–$$$", "owner": "Several workshops; Harro Fenn is the best known.", "detail": "Prices: plain Driftstone lamp 10 gp; coloured-glass lamp 15–40 gp; lamps with a notable first Hour-Tone cost more. Commissions take a tenday.", "cat": "shop", "tags": ["Shop", "Crafts", "Magistone"], "kind": "shop"}, {"code": "R3", "name": "Tick & Tally", "x": 69.5, "y": 38.1, "spec": "Cheap, fast clock and lock repair; overnight rebuilds of most mechanisms.", "price": "$", "owner": "Brannoc Hale, repairman.", "cat": "service", "tags": ["Crafts", "Services"], "kind": "shop"}, {"code": "R4", "name": "The Stranded Gull", "x": 79.0, "y": 26.5, "spec": "Tavern in an old merchant tower; crowded with crews stranded by the blockade.", "price": "$", "owner": "Maggs Teller, former bosun.", "cat": "tavern", "tags": ["Tavern", "Rumors & news"], "kind": "shop"}, {"code": "R5", "name": "Fenwick's Neverwinter Knives", "x": 74.8, "y": 33.4, "spec": "Neverwinter knives, made by one family for four generations and fitted to the buyer's grip.", "price": "$$", "owner": "Lottie Fenwick, cutler.", "detail": "Prices: Neverwinter knife (dagger, fitted) 4 gp; jeweled pommel 25 gp and up.", "cat": "shop", "tags": ["Shop", "Arms & armor"], "kind": "shop"}, {"code": "R6", "name": "The Steam Stair", "x": 77.0, "y": 41.8, "spec": "Public baths fed by the warm river; a common place to hear news.", "price": "$", "owner": "Brother Calloway, former monk.", "detail": "Three pools of rising temperature, fed by the river through copper pipes. Entry 1 cp; towel and cubby 1 sp. Captains and dock foremen do business in the hottest pool.", "cat": "service", "tags": ["Services", "Rumors & news"], "kind": "shop"}, {"code": "R7", "name": "Second Wind Pawn", "x": 67.6, "y": 41.8, "spec": "Pawnshop; stranded sailors sell their gear here.", "price": "$", "owner": "Dace Morrin, pawnbroker.", "cat": "shop", "tags": ["Shop", "Money"], "kind": "shop"}, {"code": "R8", "name": "Grisha's Smokehouse", "x": 63.6, "y": 43.4, "spec": "Smoked river fish and black bread; the cheapest full meal in the city.", "price": "$", "owner": "Grisha, half-orc, and her three sons.", "cat": "tavern", "tags": ["Food"], "kind": "shop"}, {"code": "R9", "name": "Ember & Pane", "x": 62.8, "y": 24.2, "spec": "Shared glassblowers' furnace under a red dome, rented by the hour.", "price": "$$", "owner": "Ressa Coombe, keeper of the furnace.", "cat": "service", "tags": ["Crafts", "Services"], "kind": "shop"}, {"code": "R10", "name": "House of Unbound Hearts", "x": 61.6, "y": 36.4, "spec": "Festhall and temple of Bast: music, dancing, an open stage, food and wine.", "price": "$$", "owner": "Revel-Mistress Kesi Amberlight, tabaxi priestess of Bast.", "detail": "Neverwinter's temple of Bast, goddess of passion, freedom and truth. Musicians nightly, dancing until the last Tone, and a stage where anyone may perform once. Rule: no masks past the door. Patrons pin unspoken truths on slips along the back wall; the priestesses burn them unread at each festival. Revel Walk pilgrims lodge free on festival nights. The altar holds amber-glowing Deepened Driftstone. Festivals: the Moon of Unbound Hearts (midsummer) and the Night of Velvet Whispers (early autumn).", "cat": "temple", "tags": ["Temple", "Tavern", "Food", "Entertainment", "Magistone"], "kind": "shop"}], "overview": "Workshops with housing above: lampwrights, glassblowers, clockmakers and cutlers. The old merchant towers house sailors stranded by the blockade."}, {"id": "eye", "code": "A", "name": "The Arcane Eye", "sub": "Far northeast · walled close and domed tower", "pin": [86.7, 37.0], "bounds": [78, 20, 93, 47], "quote": "", "sigName": "The Unsealing", "sig": "Each tower floor is sealed by its own tone-lock. The Circle opens them one at a time on public Unsealing days: a master strikes the floor's key-tone, the lock answers, and that floor's windows light.", "places": [{"code": "A1", "name": "Tower of the Arcane Eye", "x": 86.7, "y": 40.2, "spec": "Domed tower of the Circle of the Arcane Eye, reopened a few months ago. Closed to the public.", "price": "", "owner": "", "detail": "The Circle teaches, researches and takes apprentices. It opens its sealed floors one at a time on posted Unsealing days. Written questions can be left at the Gatehouse Board.", "cat": "landmark", "tags": ["Landmark", "Arcane", "Magistone"], "kind": "landmark"}, {"code": "A2", "name": "The Gatehouse Board", "x": 81.4, "y": 35.6, "spec": "Notices of apprenticeships, wanted books and the next Unsealing date; questions answered until dusk.", "price": "Free", "owner": "Gate-Clerk Oriel Thane.", "cat": "civic", "tags": ["Arcane", "Books & learning", "Work & hiring"], "kind": "shop"}, {"code": "A3", "name": "Components & Correspondence", "x": 83.6, "y": 33.2, "spec": "Spell components and arcane supplies; prices raised by the blockade, some reagents reserved for Circle members.", "price": "$$–$$$", "owner": "Magister Hollis Brant, merchant.", "detail": "Prices: standard components at 1.5× book price; rare reagents by order only, some rationed to Circle members.", "cat": "shop", "tags": ["Shop", "Arcane"], "kind": "shop"}, {"code": "A4", "name": "Bookcart Row", "x": 84.6, "y": 28.6, "spec": "Scholars sell duplicate books from handcarts along the inner wall; prices drop at dusk.", "price": "$–$$", "owner": "Various sellers; Tib Ostry, gnome, knows every cart's stock.", "cat": "shop", "tags": ["Shop", "Books & learning", "Arcane"], "kind": "shop"}, {"code": "A5", "name": "Unsealing-Day Stalls", "x": 87.4, "y": 44.0, "spec": "Unsealing days only: food, cider and brass tokens stamped with the floor being opened.", "price": "$", "owner": "Various vendors; collectors trade the tokens.", "cat": "shop", "tags": ["Market", "Food"], "kind": "shop"}], "overview": "Walled grounds of the Circle of the Arcane Eye, Neverwinter's wizards' institute. The tower reopened a few months ago, after the civil war. The outer gate is open to the public from first Tone to dusk; the tower is not."}, {"id": "docks", "code": "D", "name": "The Docks", "sub": "Southwest peninsula · piers, the Lashings, the islets", "pin": [19.0, 59.5], "bounds": [7, 45, 31, 68], "quote": "", "sigName": "The Channel Buoys", "sig": "Spellglass buoys mark the harbor channel and sound as the waves move them; sailors read the weather by them. Since the blockade the outer buoys are silent.", "places": [{"code": "D1", "name": "The Lashings", "x": 20.4, "y": 49.8, "spec": "Floating market of idle hulls lashed together in the inner harbor: food, gear, salvage and gambling.", "price": "$–$$", "owner": "Captain Merrit Oyle sets the rules and collects berth fees.", "cat": "shop", "tags": ["Market", "Shop", "Entertainment"], "kind": "shop"}, {"code": "D2", "name": "The Harbor Light", "x": 24.0, "y": 59.0, "spec": "Round tower at the head of the piers; dark since the blockade began.", "price": "", "owner": "", "detail": "The harbor light guided ships through the channel at night. The Harbormaster ordered it dark so the Crown Fleet cannot navigate by it.", "cat": "landmark", "tags": ["Landmark"], "kind": "landmark"}, {"code": "D3", "name": "The Beached Leviathan", "x": 12.6, "y": 55.4, "spec": "Cheap inn in a beached hulk on the causeway islet; popular with stranded sailors.", "price": "$", "owner": "Rorik Stavely, innkeeper. No refunds.", "detail": "Built into a ship that ran aground on the islet generations ago. The common room is the old hold; the rooms are cabins. A good place to hire an idle sailor.", "cat": "tavern", "tags": ["Tavern", "Inn", "Food"], "kind": "shop"}, {"code": "D4", "name": "The Harbormaster's Office", "x": 17.8, "y": 57.9, "spec": "Posts daily buoy readings; issues fishing permits inside the line; keeps berth records for every trapped ship.", "price": "Free", "owner": "Harbormaster Doran Pike.", "cat": "civic", "tags": ["Civic & law", "Guides & transport"], "kind": "shop"}, {"code": "D5", "name": "Brandt & Sons Shipyard", "x": 15.4, "y": 61.2, "spec": "Shipyard idle since the blockade; breaking up a half-built hull and selling the timber.", "price": "$", "owner": "Gunnar Brandt and four sons, carpenters.", "cat": "service", "tags": ["Crafts"], "kind": "shop"}, {"code": "D6", "name": "Tarred Rope Chandlery", "x": 22.7, "y": 63.0, "spec": "Rope, pitch, sailcloth, lanterns and charts; prices raised every tenday.", "price": "$$", "owner": "Nell Quayle, chandler.", "cat": "shop", "tags": ["Shop", "Gear & supplies"], "kind": "shop"}, {"code": "D7", "name": "Inner Harbor Fish Market", "x": 19.8, "y": 55.2, "spec": "Small boats fish inside the line at dawn; sold out by midday.", "price": "$", "owner": "Fisher cooperative; Ma Dunleavy runs the scales.", "cat": "shop", "tags": ["Market", "Food"], "kind": "shop"}, {"code": "D8", "name": "Valkur's Chapel", "x": 11.8, "y": 63.6, "spec": "Sailors' chapel to Valkur at the end of the longest pier.", "price": "Free", "owner": "Brother Ansel Marsh, priest and former navigator.", "detail": "Crews light candles here before sailing. Since the blockade the candles are for ships that cannot sail, and the racks are full.", "cat": "temple", "tags": ["Temple"], "kind": "shop"}, {"code": "D9", "name": "Gull Rock", "x": 6.4, "y": 6.4, "spec": "Rocky islet off the northwest shore with a roofless watch-fort. Reachable by skiff at low tide.", "price": "", "owner": "", "detail": "The fort dates from an older war. Gulls nest on every ledge; fishermen use the fort as shelter in a squall.", "cat": "landmark", "tags": ["Landmark"], "kind": "landmark"}], "overview": "Piers, warehouses and slipways in an ice-free harbor. No ship has passed the Crown Fleet since the blockade began. The yards are idle and crews from many ports are stranded."}, {"id": "enclave", "code": "E", "name": "The Enclave", "sub": "South bank, center · markets, gardens, Neverdeath", "pin": [42.0, 62.0], "bounds": [30, 48, 56, 89], "quote": "", "sigName": "Sounded Scrip", "sig": "With foreign coin scarce, the Mint issues Driftstone chits tuned to a single tone. Merchants test each chit with a tuning fork before accepting it.", "places": [{"code": "E1", "name": "Tyr's Eye Plaza", "x": 40.7, "y": 58.0, "spec": "Central market square: stalls, carts, criers and money-changers.", "price": "", "owner": "", "detail": "Laid out on the old city core. Most trade is in sounded scrip. Named for the eye of Tyr carved into the paving at its center.", "cat": "landmark", "tags": ["Landmark", "Market", "Magistone"], "kind": "landmark"}, {"code": "E2", "name": "The Hall of Justice", "x": 48.2, "y": 51.2, "spec": "Temple of Tyr and court of first instance; market and scrip disputes heard each afternoon.", "price": "", "owner": "", "detail": "Cross-shaped temple on the riverbank, rebuilt after the Ruining. Justiciars of Tyr hear market, debt and scrip cases in open session each afternoon; rulings bind in the Enclave. Oaths sworn on the bronze scales are respected citywide. Serious crimes go to Castle Never.", "cat": "temple", "tags": ["Temple", "Civic & law"], "kind": "shop"}, {"code": "E3", "name": "The Driftwood Tavern", "x": 39.4, "y": 62.6, "spec": "Neverwinter's best-known tavern; adventuring work posted on the board by the door.", "price": "$$", "owner": "Tamsin Rhee, proprietor.", "detail": "A long room of salvaged ship timber with a constant fire and the city's busiest notice board. Mercenaries, caravan masters and others post jobs too small for the Graycloaks.", "cat": "tavern", "tags": ["Tavern", "Inn", "Food", "Work & hiring"], "kind": "shop"}, {"code": "E4", "name": "The Mint Counter", "x": 46.6, "y": 66.8, "spec": "Exchanges foreign coin for sounded scrip at a daily posted rate that worsens each tenday.", "price": "—", "owner": "Assayer Marten Coyle.", "detail": "The only lawful exchange for scrip. Also re-tunes drifted chits for a small fee and inspects suspected forgeries.", "cat": "civic", "tags": ["Civic & law", "Money", "Magistone"], "kind": "shop"}, {"code": "E5", "name": "The Broadsheet Press", "x": 31.8, "y": 62.4, "spec": "Printers of Neverwinter Nights; pays for news.", "price": "—", "owner": "Editor Philippa Strand.", "detail": "Current issue 2 cp. Pays 1 sp for usable news, more for a good story.", "cat": "service", "tags": ["Services", "Rumors & news"], "kind": "shop"}, {"code": "E6", "name": "Pemberly's Provisions & Outfitting", "x": 36.4, "y": 65.4, "spec": "General adventuring gear; prices higher in coin than in scrip.", "price": "$$", "owner": "Hugh Pemberly, retired caravan master.", "detail": "Standard gear at book price in scrip, +10% in coin. Rope, lanterns, rations and packs always stocked; imports are not.", "cat": "shop", "tags": ["Shop", "Gear & supplies"], "kind": "shop"}, {"code": "E7", "name": "Silverleaf Apothecary", "x": 45.6, "y": 58.0, "spec": "Healing supplies and poultices; free treatment one morning a tenday.", "price": "$$", "owner": "Odessa Lark, apothecary.", "detail": "Prices: healer's kit 5 gp; potion of healing 60 gp (limited stock); antitoxin 50 gp. Free treatment one morning each tenday, first come first served.", "cat": "shop", "tags": ["Shop", "Healing"], "kind": "shop"}, {"code": "E8", "name": "The Copper Spoon", "x": 37.2, "y": 58.6, "spec": "Cookshop off the plaza; one dish at one price, changed daily.", "price": "$", "owner": "Fennick Lowe, cook.", "cat": "tavern", "tags": ["Food"], "kind": "shop"}, {"code": "E9", "name": "Rhys & Daughter, Moneylenders", "x": 42.6, "y": 64.6, "spec": "Small loans against goods, in scrip or coin.", "price": "$$", "owner": "Aldo Rhys lends; his daughter Mira collects.", "cat": "service", "tags": ["Money"], "kind": "shop"}, {"code": "E10", "name": "The Glasshouse Gardens", "x": 49.0, "y": 77.4, "spec": "Walled, river-warmed hothouse gardens against the south wall; productive year-round.", "price": "", "owner": "", "detail": "City-owned and worked by the gardeners' cooperative. Under the blockade every bench grows food. Visitors may walk the outer rows by day.", "cat": "landmark", "tags": ["Landmark"], "kind": "landmark"}, {"code": "E11", "name": "Garden Gate Stalls", "x": 46.8, "y": 71.8, "spec": "Fruit, herbs and flowers from the glasshouses, sold at the gate year-round.", "price": "$", "owner": "Gardeners' cooperative; Wilhelmina Barr keeps the till.", "cat": "shop", "tags": ["Market", "Food"], "kind": "shop"}, {"code": "E12", "name": "Neverdeath", "x": 42.8, "y": 84.4, "spec": "Walled city graveyard in the southwest square, kept by the faithful of Kelemvor.", "price": "", "owner": "Sister Wenna Holloway, keeper.", "detail": "Laid out after the Ruining. Many graves carry a small Driftstone bell that mourners strike on anniversaries. The gate is open day and night.", "cat": "temple", "tags": ["Temple", "Landmark"], "kind": "shop"}, {"code": "E13", "name": "The Oldest Row", "x": 42.6, "y": 77.6, "spec": "The first row of graves along Neverdeath's north wall.", "price": "", "owner": "", "detail": "The oldest burials in the yard.", "cat": "landmark", "tags": ["Landmark"], "kind": "landmark"}, {"code": "E15", "name": "The Gray Anvil", "x": 33.5, "y": 59.2, "spec": "Weaponsmith and shield-maker between the two castle bridges; spears, swords, crossbows, shields and repair.", "price": "$$", "owner": "Ysolde Varga, smith.", "detail": "Holds the city contract for Graycloak spears, crossbows and shields. With imported steel cut off, she reforges scrap, half of it from Ashbeard Salvage. Prices: simple weapons at book price; martial weapons and shields +20%; crossbow bolts 1 gp per 20; sharpening and repair 5 sp.", "cat": "shop", "tags": ["Shop", "Arms & armor"], "kind": "shop"}], "overview": "The main south-bank district, rebuilt on the old city core after the Ruining: markets, guildhalls, temples, printers and taverns. The Glasshouse Gardens and Neverdeath, the city graveyard, stand in two walled squares against the south wall."}, {"id": "artificers", "code": "Q", "name": "Artificers' Quarter", "sub": "Southeast · western rim of the flooded Chasm", "pin": [63.5, 60.0], "bounds": [54, 49, 77, 76], "quote": "", "sigName": "The Proving", "sig": "On the first of each month the Vaelcrest Collegium posts a Problem at the Proving Rail. Shops have three days to answer it. Entries are tested over the Chasm and judged on the third night; the winning design is published free in the Open Ledger. Outsiders can enter with a shop's sponsorship.", "places": [{"code": "Q1", "name": "The Proving Rail", "x": 71.6, "y": 60.6, "spec": "Iron rail on the Chasm rim where finished work is tested; site of the Proving judging.", "price": "", "owner": "", "detail": "A finished piece struck over the water makes the Chasm walls answer in the colour of its stone. A clean answer earns the mark 'rail-proved'. The month's Proving Problem is posted here.", "cat": "landmark", "tags": ["Landmark", "Magistone"], "kind": "landmark"}, {"code": "Q2", "name": "The Vaelcrest Collegium", "x": 56.9, "y": 65.2, "spec": "Artificers' college; sets the monthly Problem and judges the Proving.", "price": "", "owner": "", "detail": "Founded by House Vaelcrest and reopened after the Sundering. Trains artificers and tuners, judges Proving entries with the guild masters and keeps the Open Ledger. Admission by examination twice a year.", "cat": "civic", "tags": ["Books & learning", "Magistone", "Civic & law"], "kind": "shop"}, {"code": "Q3", "name": "The Resonant Shelf", "x": 61.8, "y": 53.9, "spec": "Tuning and repair of Magistone instruments; stone grading.", "price": "$$", "owner": "Tessa Orvaine, Cormyrian tuner. Selective about commissions.", "detail": "Prices: re-tuning a fork or lamp core 2 gp; grading a stone 1 gp; repairs quoted per job.", "cat": "service", "tags": ["Magistone", "Services", "Crafts"], "kind": "shop"}, {"code": "Q4", "name": "Orrin & Daughters, Forkwrights", "x": 65.7, "y": 57.4, "spec": "Tuning forks of every grade, including scrip-testing forks and custom forks.", "price": "$–$$", "owner": "Orrin Daubney and his three daughters.", "detail": "Prices: plain fork 1 gp; scrip-testing fork 2 gp; grade-tuned fork 5 gp; custom fork tuned to a hummed note 10 gp.", "cat": "shop", "tags": ["Shop", "Magistone"], "kind": "shop"}, {"code": "Q5", "name": "The Rail", "x": 69.0, "y": 64.4, "spec": "Tavern of the Proving crews; past Problems and winners listed on a slate wall.", "price": "$", "owner": "Bettrice Coale, two-time Proving winner.", "cat": "tavern", "tags": ["Tavern", "Rumors & news"], "kind": "shop"}, {"code": "Q6", "name": "Quist's Lampglass", "x": 59.8, "y": 59.2, "spec": "Neverwinter's multicoloured lamp glass: shades, panes and finished lamps.", "price": "$$", "owner": "Hollen Quist, half-elf glassmaker.", "detail": "Prices: shade 5 gp; pane 10 gp; finished lamp 20–40 gp. Blue costs a third more.", "cat": "shop", "tags": ["Shop", "Crafts", "Magistone"], "kind": "shop"}, {"code": "Q7", "name": "Copperkettle Contrivances", "x": 64.4, "y": 63.8, "spec": "Small clockwork and Driftstone gadgets.", "price": "$–$$", "owner": "Pim and Wesna Copperkettle, gnome siblings.", "cat": "shop", "tags": ["Shop", "Crafts", "Magistone", "Work & hiring"], "kind": "shop"}, {"code": "Q8", "name": "Ashbeard Salvage", "x": 65.4, "y": 69.2, "spec": "Scrapyard on the rim; parts and fittings at prices doubled by the blockade.", "price": "$–$$", "owner": "Hrolga Ashbeard, dwarf.", "cat": "shop", "tags": ["Shop", "Crafts"], "kind": "shop"}, {"code": "Q9", "name": "Ostrander Armory", "x": 60.6, "y": 70.4, "spec": "Plate and mail; Driftstone warming linings; refuses Magistone weapons.", "price": "$$–$$$", "owner": "Keld Ostrander, armorer.", "detail": "Armor at book price. Driftstone warming lining fitted to any armor 50 gp; struck each morning, it keeps the wearer warm in cold weather. Will not make weapons with Magistone fittings.", "cat": "shop", "tags": ["Shop", "Arms & armor", "Magistone"], "kind": "shop"}, {"code": "Q10", "name": "Mother Nesk's Bench Pies", "x": 68.2, "y": 58.8, "spec": "Pie cart that follows the Proving crews; pies kept hot on a Driftstone chip.", "price": "$", "owner": "Mother Nesk, cook.", "cat": "tavern", "tags": ["Food", "Magistone"], "kind": "shop"}, {"code": "Q11", "name": "Open Ledger Reading Room", "x": 57.6, "y": 61.4, "spec": "Collegium annex holding every winning Proving design, free to read and copy.", "price": "Free", "owner": "Scribe Tobias Wren.", "cat": "civic", "tags": ["Books & learning", "Magistone"], "kind": "shop"}, {"code": "Q12", "name": "The Mended Bridge", "x": 67.7, "y": 71.4, "spec": "Bridge over the flooded Chasm to the Eastgate Groves.", "price": "", "owner": "", "detail": "Rebuilt from the remains of the old bridge: stone at both ends, timber across the widest gap.", "cat": "landmark", "tags": ["Landmark"], "kind": "landmark"}], "overview": "Built on the rim of the Chasm where the old Arcanist Quarter fell in the Ruining. The Sundering fused the Chasm walls and the river flooded it. Tinkers, forkwrights, tuners, salvagers and the Vaelcrest Collegium are based here."}, {"id": "groves", "code": "G", "name": "Eastgate Groves", "sub": "Far southeast · orchards and the east gate", "pin": [84.0, 62.0], "bounds": [72, 47, 93, 83], "quote": "", "sigName": "The Dusk Rounds", "sig": "Driftstone warming-stones are buried at the roots of every row. Keepers strike them each dusk, and they keep the soil warm overnight, so fruit ripens through winter. Volunteers are accepted.", "places": [{"code": "G1", "name": "Orchard Keepers' Hall", "x": 85.0, "y": 54.8, "spec": "Orchard keepers' guildhall; organizes the Dusk Rounds and pays volunteers in fruit.", "price": "Free", "owner": "Keeper-Elder Amara Holt.", "detail": "The keepers tend every tree in the Groves and walk the Dusk Rounds. Since the blockade the Hall tracks how much food the Groves can supply. Volunteers learn the strike in one evening.", "cat": "civic", "tags": ["Magistone", "Work & hiring"], "kind": "shop"}, {"code": "G2", "name": "The Last Pressing", "x": 83.0, "y": 65.0, "spec": "Cider house in an old barn; serves the week's pressing.", "price": "$", "owner": "Garret and Lune Ashby, brewers.", "cat": "tavern", "tags": ["Tavern", "Food"], "kind": "shop"}, {"code": "G3", "name": "The Last Lantern", "x": 89.6, "y": 50.8, "spec": "Inn beside the east gate, the last before Neverwinter Wood; Wood guides for hire.", "price": "$$", "owner": "Sorrel Banks, former Wood guide.", "detail": "Guides hire by the day: 5 gp to the Wood's edge, more for deeper.", "cat": "tavern", "tags": ["Inn", "Tavern", "Guides & transport"], "kind": "shop"}, {"code": "G4", "name": "Old Alder's Hives", "x": 88.2, "y": 69.6, "spec": "Honey, wax and candles from bees that work the orchards year-round.", "price": "$", "owner": "Old Alder, beekeeper.", "cat": "shop", "tags": ["Shop", "Food"], "kind": "shop"}, {"code": "G5", "name": "Brindle Farm Stand", "x": 75.6, "y": 73.4, "spec": "Vegetables grown inside the walls; sold out by noon under the blockade.", "price": "$", "owner": "The Brindle family.", "cat": "shop", "tags": ["Market", "Food"], "kind": "shop"}, {"code": "G6", "name": "Hotenow Charcoal", "x": 78.8, "y": 80.4, "spec": "Charcoal from the Wood's edge; supplies half the city's forges since coal stopped arriving.", "price": "$", "owner": "Brede Carrick, charcoal burner.", "cat": "shop", "tags": ["Shop"], "kind": "shop"}, {"code": "G7", "name": "The Dead Row", "x": 86.2, "y": 74.6, "spec": "A row near the wall where nothing has grown since the Sundering.", "price": "", "owner": "", "detail": "The keepers still walk it every dusk.", "cat": "landmark", "tags": ["Landmark"], "kind": "landmark"}], "overview": "Orchards, market gardens, beehives and the east gate to Neverwinter Wood. Under the blockade every plot grows food, and the orchard keepers manage much of the city's supply."}], "key": "nw-city-map-v2"};

const IMG_W = 1532, IMG_H = 1080, DETAIL = 2.0;
const KEY = 'nw-city-map-v2';
const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };
let ticks = {}; try{ ticks = JSON.parse(store.get(KEY+':ticks')||'{}')||{}; }catch(e){ ticks = {}; }
let SECRET = null, dm = false, askPw = false, pwErr = '';
let sel = { d:null, p:null };
const vp = document.getElementById('vp'), stage = document.getElementById('stage'), layer = document.getElementById('layer');
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let s = 1, tx = 0, ty = 0, fit = 1;
const esc = t => String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const D = id => DATA.districts.find(d => d.id === id);
const placesOf = d => d ? d.places.concat((sec() && SECRET.places[d.id]) || []) : [];
const P = (d, code) => d && placesOf(d).find(p => p.code === code);

/* ---------- DM vault (AES-GCM, PBKDF2) ---------- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  if(!(window.crypto && crypto.subtle)) throw new Error('This browser cannot decrypt the DM notes here.');
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(VAULT.salt), iterations:VAULT.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const buf = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(VAULT.iv)}, key, b64(VAULT.ct));
  return JSON.parse(new TextDecoder().decode(buf));
}
const sec = () => (dm && SECRET) ? SECRET : null;

/* ---------- map transform ---------- */
function vpSize(){ const r = vp.getBoundingClientRect(); return { w:r.width, h:r.height }; }
function computeFit(){ const {w,h} = vpSize(); fit = Math.min(w/IMG_W, h/IMG_H); }
function clamp(){
  const {w,h} = vpSize(); const mw = IMG_W*s, mh = IMG_H*s;
  if(mw <= w) tx = (w-mw)/2; else tx = Math.min(0, Math.max(w-mw, tx));
  if(mh <= h) ty = (h-mh)/2; else ty = Math.min(0, Math.max(h-mh, ty));
}
function place(){
  for(const el of layer.children){
    const x = +el.dataset.x, y = +el.dataset.y;
    el.style.left = (tx + x/100*IMG_W*s).toFixed(1) + 'px';
    el.style.top = (ty + y/100*IMG_H*s).toFixed(1) + 'px';
  }
}
function apply(){
  clamp();
  stage.style.transform = `translate(${tx}px,${ty}px) scale(${s})`;
  const detail = s/fit >= DETAIL;
  vp.classList.toggle('mode-detail', detail); vp.classList.toggle('mode-city', !detail);
  document.getElementById('hint').textContent = detail ? 'Click a pin for the shop or landmark' : 'Pick a district, or zoom in to see shops';
  place();
}
function zoomAt(ns, cx, cy){
  ns = Math.max(fit, Math.min(fit*7, ns));
  tx = cx - (cx - tx) * (ns/s); ty = cy - (cy - ty) * (ns/s); s = ns; apply();
}
let anim = null;
function flyTo(ns, ntx, nty){
  if(anim) cancelAnimationFrame(anim);
  if(reduce){ s=ns; tx=ntx; ty=nty; apply(); return; }
  const s0=s, x0=tx, y0=ty, t0=performance.now(), dur=480;
  const step = now => { const k=Math.min(1,(now-t0)/dur), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    s=s0+(ns-s0)*e; tx=x0+(ntx-x0)*e; ty=y0+(nty-y0)*e; apply(); if(k<1) anim=requestAnimationFrame(step); };
  anim = requestAnimationFrame(step);
}
function flyBounds(b){
  const {w,h} = vpSize(); const bw=(b[2]-b[0])/100*IMG_W, bh=(b[3]-b[1])/100*IMG_H;
  let ns = Math.min(w/bw, h/bh)*0.94; ns = Math.max(ns, fit*DETAIL*1.02);
  const cx=(b[0]+b[2])/200*IMG_W, cy=(b[1]+b[3])/200*IMG_H;
  flyTo(ns, w/2-cx*ns, h/2-cy*ns);
}
function flyPoint(x, y){
  const {w,h} = vpSize(); const ns = Math.max(s, fit*DETAIL*1.4);
  flyTo(ns, w/2-x/100*IMG_W*ns, h/2-y/100*IMG_H*ns);
}
function flyCity(){ computeFit(); const {w,h}=vpSize(); flyTo(fit,(w-IMG_W*fit)/2,(h-IMG_H*fit)/2); }

/* pan / pinch / wheel */
const ptrs = new Map(); let lastPinch = 0, moved = 0;
vp.addEventListener('pointerdown', e => { if(e.target.closest('.ctrls')) return; ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=0; if(ptrs.size===1) vp.classList.add('drag'); });
window.addEventListener('pointermove', e => {
  if(!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){ const dx=e.clientX-prev.x, dy=e.clientY-prev.y; moved+=Math.abs(dx)+Math.abs(dy); if(moved>4){ tx+=dx; ty+=dy; apply(); } }
  else if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); const r=vp.getBoundingClientRect();
    if(lastPinch) zoomAt(s*d/lastPinch,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top); lastPinch=d; moved=99; }
});
const endPtr = e => { ptrs.delete(e.pointerId); if(ptrs.size<2) lastPinch=0; if(!ptrs.size) vp.classList.remove('drag'); };
window.addEventListener('pointerup', endPtr); window.addEventListener('pointercancel', endPtr);
vp.addEventListener('click', e => { if(moved>4){ e.stopPropagation(); e.preventDefault(); } }, true);
vp.addEventListener('wheel', e => { e.preventDefault(); const r=vp.getBoundingClientRect(); zoomAt(s*Math.exp(-e.deltaY*0.0015), e.clientX-r.left, e.clientY-r.top); }, {passive:false});
document.getElementById('zin').onclick = () => { const {w,h}=vpSize(); zoomAt(s*1.4,w/2,h/2); };
document.getElementById('zout').onclick = () => { const {w,h}=vpSize(); zoomAt(s/1.4,w/2,h/2); };
document.getElementById('zcity').onclick = () => { sel={d:null,p:null}; render(); flyCity(); };
window.addEventListener('resize', () => { const old=fit; computeFit(); if(Math.abs(s-old)<1e-6) s=fit; apply(); });

/* ---------- pins (screen-space, so text stays sharp) ---------- */
function clueList(p){ const S = sec(); return S ? (S.clues[p.code] || []) : []; }
const placeDone = p => { const cs = clueList(p); return cs.length && cs.every(c => ticks[c.n]); };
function sym(cat, num, cls){
  const c = CATS[cat] || CATS.landmark;
  return `<span class="sym ${cls||''}"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="${c.d}" fill="${c.fill}" stroke="#f6ecd4" stroke-width="1.6" stroke-linejoin="round"/></svg><span class="num" style="left:${c.cx/32*100}%;top:${c.cy/32*100}%;color:${c.ink}">${num}</span></span>`;
}
const catLabel = cat => (sec() && SECRET.catLabels && SECRET.catLabels[cat]) || CATS[cat].label;
let legendMin = store.get(KEY+':legend') === 'min';
function drawLegend(){
  const el = document.getElementById('legend');
  let h = `<div class="lh"><span>Map key</span><button id="legbtn" aria-expanded="${!legendMin}">${legendMin?'Show':'Hide'}</button></div>`;
  Object.keys(CATS).forEach(k => { if(CATS[k].dm && !dm) return; h += `<span class="le">${sym(k,'')}${esc(catLabel(k))}</span>`; });
  el.innerHTML = h; el.classList.toggle('min', legendMin);
  document.getElementById('legbtn').onclick = () => { legendMin = !legendMin; store.set(KEY+':legend', legendMin?'min':''); drawLegend(); };
}
function wordsOf(p){ if(!p._w) p._w = (p.name+' '+(p.owner||'')+' '+p.spec+' '+(p.tags||[]).join(' ')).toLowerCase().split(/[^a-z0-9']+/).filter(Boolean); return p._w; }
function matches(p, q){
  for(const t of activeTags) if(!(p.tags||[]).includes(t)) return false;
  if(!q) return true;
  const w = wordsOf(p);
  return q.split(/\s+/).filter(Boolean).every(term => w.some(x => x.startsWith(term)));
}
const filtering = () => activeTags.size > 0 || document.getElementById('q').value.trim() !== '';
function tagOrder(){ return TAGORDER.concat(sec() && SECRET.tagOrder ? SECRET.tagOrder : []); }
function drawTags(){
  const el = document.getElementById('tags'); const counts = {};
  DATA.districts.forEach(d => placesOf(d).forEach(p => (p.tags||[]).forEach(t => counts[t]=(counts[t]||0)+1)));
  const keep = el.scrollLeft; let h = '';
  document.getElementById('tclear').hidden = !(activeTags.size || document.getElementById('q').value);
  tagOrder().forEach(t => { if(!counts[t]) return; h += `<button class="tag${activeTags.has(t)?' on':''}" data-tag="${esc(t)}" aria-pressed="${activeTags.has(t)}">${esc(t)}<small>${counts[t]}</small></button>`; });
  el.innerHTML = h; el.scrollLeft = keep;
}
document.getElementById('tclear').onclick = () => { activeTags.clear(); document.getElementById('q').value=''; render(); };
document.getElementById('tags').addEventListener('click', e => { const b = e.target.closest('[data-tag]'); if(!b) return;
  const t = b.dataset.tag; if(t==='__clear') activeTags.clear(); else if(activeTags.has(t)) activeTags.delete(t); else activeTags.add(t);
  render(); });
function drawPins(){
  let h = ''; const filt = filtering(), qq = document.getElementById('q').value.trim().toLowerCase();
  vp.classList.toggle('filtering', filt);
  DATA.districts.forEach(d => {
    h += `<button class="chip${sel.d===d.id&&!sel.p?' on':''}" data-x="${d.pin[0]}" data-y="${d.pin[1]}" data-d="${d.id}" aria-label="${esc(d.name)}"><b>${d.code}</b>${esc(d.name)}</button>`;
    h += `<div class="dlabel" data-x="${(d.bounds[0]+d.bounds[2])/2}" data-y="${d.bounds[1]+2.2}">${esc(d.name)}</div>`;
    placesOf(d).forEach(p => {
      const n = p.code.replace(/^[A-Z]/,'');
      h += `<button class="pin cat-${p.cat}${sel.p===p.code?' on':''}${placeDone(p)?' done':''}${filt?(matches(p,qq)?' match':' nomatch'):''}" data-x="${p.x}" data-y="${p.y}" data-d="${d.id}" data-p="${p.code}" aria-label="${esc(p.code+' '+p.name+', '+catLabel(p.cat))}">${sym(p.cat, p.cat==='site'?'!':n)}<span class="tip">${esc(p.code)} · ${esc(p.name)}</span></button>`;
    });
  });
  layer.innerHTML = h; place();
}
layer.addEventListener('click', e => {
  const el = e.target.closest('[data-d]'); if(!el) return;
  const d = D(el.dataset.d);
  if(el.dataset.p) openPlace(d, el.dataset.p, false); else openDistrict(d);
});
function openDistrict(d){ sel={d:d.id,p:null}; document.getElementById('q').value=''; render(); flyBounds(d.bounds); }
function openPlace(d, code, fly){ sel={d:d.id,p:code}; document.getElementById('q').value=''; render(); const p=P(d,code); if(fly||s/fit<DETAIL) flyPoint(p.x,p.y); }

/* ---------- panel ---------- */
function clueHTML(c){
  const x = c;
  const tb = x ? (x.truths||[]).map(t => `<span class="tb">CC ${t}</span>`).join('') : '';
  const cls = 'clue' + (x && x.big ? ' big' : '') + (x && x.dm ? ' dmonly' : '');
  return `<div class="${cls}"><div class="chd"><span class="cn">${c.n}</span><span class="ct"><b>${esc(c.t)}</b>${tb}${x?`<small>${esc(x.gate)}</small>`:''}</span><button class="tick${ticks[c.n]?' on':''}" data-tick="${c.n}" aria-label="Mark delivered">&#10003;</button></div>`
   + `<div class="cbd"><p class="tell">${esc(c.tell)}</p>${x?`<p class="mean"><b>What it means:</b> ${esc(x.mean)}</p>`:''}</div></div>`;
}
function truthHTML(){
  const S = sec(); if(!S) return '';
  const lit = {};
  DATA.districts.forEach(d => placesOf(d).forEach(p => clueList(p).forEach(c => { if(ticks[c.n]) (c.truths||[]).forEach(t => lit[t]=1); })));
  let h = '<h3>The Cold Companion · truth tracker</h3>';
  Object.entries(S.truths).forEach(([k,v]) => { const core = S.core.includes(k);
    h += `<div class="trow${core?' core':''}"><span class="dot${lit[k]?' lit':''}"></span><span><b>${k}.</b> ${esc(v)}</span></div>`; });
  return h + '<p class="sub" style="margin-top:6px">Gold lines cannot be lost. Ticking a clue lights the truths it supports.</p>';
}
function lockHTML(){
  if(!askPw) return '';
  return `<form class="lock" id="lockform"><label for="pw">Enter the DM password</label><div class="prow"><input id="pw" type="password" autocomplete="off"><button type="submit">Unlock</button></div>${pwErr?`<p class="err">${esc(pwErr)}</p>`:''}</form>`;
}
function crumb(){
  const c = document.getElementById('crumb'); const d = sel.d && D(sel.d), p = d && P(d, sel.p);
  let h = `<a data-go="city">${esc(DATA.city.title)}</a>`;
  if(d) h += ` › ${p ? `<a data-go="d">${esc(d.name)}</a>` : esc(d.name)}`;
  if(p) h += ` › ${esc(p.name)}`;
  c.innerHTML = h;
}
document.getElementById('crumb').addEventListener('click', e => { const a=e.target.closest('[data-go]'); if(!a) return;
  if(a.dataset.go==='city'){ sel={d:null,p:null}; render(); flyCity(); } else openDistrict(D(sel.d)); });
function itemHTML(d, p, showDistrict){
  return `<button class="item" data-d="${d.id}" data-p="${p.code}">${sym(p.cat, p.cat==='site'?'!':p.code.replace(/^[A-Z]/,''), 'isym')}<span><b>${esc(p.code)} · ${esc(p.name)}</b><span class="meta">${showDistrict?esc(d.name)+' · ':''}${esc((p.tags||[]).join(', '))}${p.price?' · '+esc(p.price):''}${p.owner&&p.kind==='shop'?' · '+esc(p.owner.split(',')[0]):''}</span></span></button>`;
}
function render(){
  crumb(); drawTags(); drawPins();
  const S = sec();
  const body = document.getElementById('body'); const q = document.getElementById('q').value.trim().toLowerCase();
  let h = lockHTML();
  if((q || activeTags.size) && !sel.p){
    let rows = '', n = 0;
    DATA.districts.forEach(d => placesOf(d).forEach(p => { if(matches(p,q)){ n++; rows += itemHTML(d,p,true); } }));
    const what = [...activeTags].join(' + ') + (q ? (activeTags.size?' · ':'') + '“' + q + '”' : '');
    h += `<h2>${n} ${n===1?'place':'places'}</h2><p class="sub">${esc(what)}${activeTags.size?' · matching places stay lit on the map':''}</p><div class="list">${rows}</div>` + (n?'':'<p class="empty">Nothing matches. Try removing a tag.</p>');
  } else if(!sel.d){
    const c = DATA.city;
    h += `<h1>${esc(c.title)}</h1><p class="sub">${esc(c.sub)}</p>${c.quote?`<p class="quote">${esc(c.quote)}</p>`:""}`;
    c.globals.forEach(g => h += `<div class="read"><span class="lbl">${esc(g[0])}</span>${esc(g[1])}</div>`);
    if(S){ S.dmGlobals.forEach(g => h += `<div class="dmn"><b>${esc(g[0])}.</b> ${esc(g[1])}</div>`); h += truthHTML(); }
    h += '<h3>Districts</h3><div class="list">';
    DATA.districts.forEach(d => { const shops=d.places.filter(p=>p.kind==='shop').length;
      h += `<button class="item" data-d="${d.id}"><span class="code site">${d.code}</span><span><b>${esc(d.name)}</b><span class="meta">${esc(d.sub)} · ${shops} shops</span></span></button>`; });
    h += '</div>';
  } else {
    const d = D(sel.d), p = P(d, sel.p);
    if(sel.p && !p) sel.p = null;
    if(!p){
      h += `<h2>${esc(d.name)}</h2><p class="sub">${esc(d.sub)}</p>${d.quote?`<p class="quote">${esc(d.quote)}</p>`:""}`;
      h += `<p class="detail">${esc(d.overview)}</p>`;
      if(S && S.dreads[d.id]) h += `<div class="read"><span class="lbl">Read aloud</span>${esc(S.dreads[d.id])}</div>`;
      h += `<div class="card sig"><span class="lbl">${esc(d.sigName)}</span>${esc(d.sig)}</div>`;
      const all = placesOf(d), shops = all.filter(x=>x.kind==='shop'), lands = all.filter(x=>x.kind==='landmark'), marks = all.filter(x=>x.kind==='site'||x.kind==='hearth');
      if(shops.length){ h += '<h3>Shops & establishments</h3><div class="list">'; shops.forEach(x => h += itemHTML(d,x)); h += '</div>'; }
      if(lands.length){ h += '<h3>Landmarks</h3><div class="list">'; lands.forEach(x => h += itemHTML(d,x)); h += '</div>'; }
      if(marks.length){ h += '<h3>DM markers</h3><div class="list">'; marks.forEach(x => h += itemHTML(d,x)); h += '</div>'; }
      if(S && d.id==='enclave') h += truthHTML();
      h += `<button class="back" data-go="city">&larr; Whole city</button>`;
    } else {
      const kind = catLabel(p.cat);
      h += `<h2>${esc(p.name)}</h2><p class="sub">${esc(p.code)} · ${kind} · ${esc(d.name)}</p>`;
      h += '<dl class="kv">';
      if(p.owner) h += `<dt>${p.kind==='shop'?'Owner':'Keeper'}</dt><dd>${esc(p.owner)}</dd>`;
      h += `<dt>${p.kind==='shop'?'Trade':'What'}</dt><dd>${esc(p.spec)}</dd>`;
      if(p.price) h += `<dt>Price</dt><dd>${esc(p.price)}</dd>`;
      h += '</dl>';
      if((p.tags||[]).length) h += '<div class="pills">' + p.tags.map(t => `<button class="pill" data-tag="${esc(t)}">${esc(t)}</button>`).join('') + '</div>';
      if(p.detail) h += `<p class="detail">${esc(p.detail)}</p>`;
      if(S && S.reads[p.code]) h += `<div class="read"><span class="lbl">Read aloud</span>${esc(S.reads[p.code])}</div>`;
      if(S && (S.placeDm[p.code]||p.dm||[]).length){ h += '<h3>DM notes</h3>'; (S.placeDm[p.code]||p.dm).forEach(n => h += `<div class="dmn">${esc(n)}</div>`); }
      const cs = clueList(p);
      if(cs.length){ h += `<h3>Worth a closer look</h3>`; cs.forEach(c => h += clueHTML(c)); }
      if(S && p.kind==='site') h += truthHTML();
      h += activeTags.size ? `<button class="back" data-go="results">&larr; Back to results</button>` : `<button class="back" data-go="d">&larr; ${esc(d.name)}</button>`;
    }
  }
  body.innerHTML = h;
  if(askPw){ const f=document.getElementById('lockform'); f.onsubmit = trySubmit; document.getElementById('pw').focus(); }
}
async function trySubmit(e){
  e.preventDefault(); const pw = document.getElementById('pw').value;
  try{ SECRET = await unlock(pw); dm = true; askPw = false; pwErr = ''; syncDm(); render(); }
  catch(err){ pwErr = (err && err.message && /browser/.test(err.message)) ? err.message : 'That password is not right.'; render(); }
}
document.getElementById('body').addEventListener('click', e => {
  const pl = e.target.closest('.pill[data-tag]'); if(pl){ activeTags.clear(); activeTags.add(pl.dataset.tag); render(); return; }
  const t = e.target.closest('[data-tick]');
  if(t){ e.stopPropagation(); const n=t.dataset.tick; ticks[n]=!ticks[n]; store.set(KEY+':ticks', JSON.stringify(ticks)); render(); return; }
  const hd = e.target.closest('.chd'); if(hd){ hd.parentNode.classList.toggle('open'); return; }
  const it = e.target.closest('.item');
  if(it){ const d=D(it.dataset.d); if(it.dataset.p) openPlace(d, it.dataset.p, true); else openDistrict(d); return; }
  const g = e.target.closest('[data-go]');
  if(g && g.dataset.go==='results'){ sel.p=null; render(); return; }
  if(g){ if(g.dataset.go==='city'){ sel={d:null,p:null}; render(); flyCity(); } else openDistrict(D(sel.d)); }
});
document.getElementById('q').addEventListener('input', render);
document.getElementById('q').placeholder = 'Search names, owners, or types (e.g. magistone, inn)';
const dmBtn = document.getElementById('dm');
function syncDm(){ vp.classList.toggle('dm', dm); drawLegend(); dmBtn.textContent = dm ? 'DM view: on' : 'DM view: locked'; dmBtn.classList.toggle('on', dm); dmBtn.setAttribute('aria-pressed', dm); }
dmBtn.onclick = () => {
  if(dm){ dm = false; syncDm(); render(); return; }
  if(SECRET){ dm = true; syncDm(); render(); return; }
  askPw = !askPw; pwErr = ''; render();
};
document.addEventListener('keydown', e => { if(e.key!=='Escape' || e.target.id==='pw') return;
  if(activeTags.size || document.getElementById('q').value){ activeTags.clear(); document.getElementById('q').value=''; render(); return; }
  if(sel.p){ openDistrict(D(sel.d)); } else if(sel.d){ sel={d:null,p:null}; render(); flyCity(); } });

syncDm(); computeFit(); s=fit; apply(); render();
document.getElementById('img').addEventListener('load', () => { computeFit(); s=fit; apply(); });
</script>

</body></html>
